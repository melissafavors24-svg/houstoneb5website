<style>
  /* ---------- Geography: Too Broad / Too Narrow ---------- */
  .eb5-geo{
    color:#1F2A33;
    line-height:1.65;
    font-size:16px;
  }
  .eb5-geo *{box-sizing:border-box;}
  .eb5-geo .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  .eb5-geo .card{
    background:#FFFFFF;
    border:1px solid #C7D3E6;
    border-top:4px solid #003E5B;
    border-radius:10px;
    box-shadow:0 1px 3px rgba(7,34,44,.04);
    padding:18px 20px;
  }
  .eb5-geo h4{
    color:#003E5B;
    font-size:16px;
    margin:0 0 6px;
  }
  .eb5-geo p{margin:0;font-size:15px;}

  @media (max-width:720px){
    .eb5-geo .grid{grid-template-columns:1fr;}
  }
</style>

<div class="eb5-geo">
  <div class="grid">
    <div class="card">
      <h4>Too Broad</h4>
      <p>The job count may be inflated.</p>
    </div>
    <div class="card">
      <h4>Too Narrow</h4>
      <p>The model may miss real local supply-chain effects.</p>
    </div>
  </div>
</div>
