<style>
  /* ---------- Eligible vs. Non-Qualifying Costs ---------- */
  .eb5-costs{
    color:#1F2A33;
    line-height:1.65;
    font-size:16px;
  }
  .eb5-costs *{box-sizing:border-box;}
  .eb5-costs .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  .eb5-costs .card{
    background:#FFFFFF;
    border:1px solid #C7D3E6;
    border-radius:10px;
    box-shadow:0 1px 3px rgba(7,34,44,.04);
    overflow:hidden;
  }
  .eb5-costs .card.yes{border-top:4px solid #1E7A3D;}
  .eb5-costs h4{
    background:#003E5B;
    color:#FFFFFF;
    margin:0;
    padding:12px 18px;
    font-size:15px;
    letter-spacing:.3px;
  }
  .eb5-costs .card.no h4{background:#B23B3B;}
  .eb5-costs ul{
    list-style:none;
    margin:0;
    padding:14px 18px 16px;
  }
  .eb5-costs li{
    position:relative;
    padding:0 0 10px 24px;
    font-size:14.5px;
  }
  .eb5-costs li:last-child{padding-bottom:0;}
  .eb5-costs .yes li::before{
    content:"";
    position:absolute;
    left:2px;top:7px;
    width:10px;height:6px;
    border-left:2px solid #1E7A3D;
    border-bottom:2px solid #1E7A3D;
    transform:rotate(-45deg);
  }
  .eb5-costs .no li::before{
    content:"!";
    position:absolute;
    left:0;top:3px;
    width:16px;height:16px;
    border-radius:50%;
    background:#B23B3B;
    color:#FFFFFF;
    font-size:11px;
    font-weight:800;
    line-height:16px;
    text-align:center;
  }

  @media (max-width:720px){
    .eb5-costs .grid{grid-template-columns:1fr;}
  }
</style>

<div class="eb5-costs">
  <div class="grid">
    <div class="card yes">
      <h4>Eligible Project Costs</h4>
      <ul>
        <li>Labor</li>
        <li>Materials</li>
        <li>General conditions</li>
        <li>Design and engineering</li>
      </ul>
    </div>
    <div class="card no">
      <h4>Should Not Be Relied On</h4>
      <ul>
        <li>Land purchases</li>
        <li>Purely financial transfers</li>
        <li>Expenses that do not create local economic activity</li>
      </ul>
    </div>
  </div>
</div>
